name: Xime

options:
  minimumXcodeGenVersion: 2.38.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "$(inherited) -lc++"

targets:
  Xime:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../app/src/main/assets/rime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingzcheung.xime
        PRODUCT_NAME: Xime
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Config/Xime-Info.plist
      properties:
        CFBundleDisplayName: Xime
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/Xime.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kingzcheung.xime
    dependencies:
      - target: XimeKeyboard
        embed: true

  XimeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      - path: ../app/src/main/assets/rime
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingzcheung.xime.keyboard
        PRODUCT_NAME: XimeKeyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/XimeKeyboard-Info.plist
      properties:
        CFBundleDisplayName: Xime
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: XPC!
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    entitlements:
      path: Config/XimeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kingzcheung.xime

schemes:
  Xime:
    build:
      targets:
        Xime: all
        XimeKeyboard: all
    run:
      config: Debug
    archive:
      config: Release
