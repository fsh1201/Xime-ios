name: iOS Rime IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-preview
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive \
            app/src/main/jni/librime \
            app/src/main/jni/snappy \
            app/src/main/assets/rime

      - name: Build librime for iOS
        run: ./ios/scripts/build-rime-ios-from-source.sh

      - name: Enable Rime bridge
        run: ./ios/scripts/enable-rime.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project Xime.xcodeproj \
            -scheme Xime \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/Xime.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Xime-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xime-unsigned-ipa
          path: Xime-unsigned.ipa
          if-no-files-found: error
