name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - ios-preview
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 最小骨架不链接 librime，也不读取 rime 数据。
      # XcodeGen 只要求该目录存在；完整 Rime 构建时才需要初始化子模块。
      - name: Prepare rime resource directory
        run: mkdir -p app/src/main/assets/rime

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project Xime.xcodeproj \
            -scheme Xime \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/Xime.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Xime-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Xime-unsigned-ipa
          path: Xime-unsigned.ipa
          if-no-files-found: error
